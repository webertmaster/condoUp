<!-- 🎯 BANNER PREMIUM — Estilo Stripe/Notion/Linear -->
<div id="banner-premium-vencimento" class="banner-premium" style="display: none;">

    <!-- Barra de Progresso no Topo -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>

    <!-- Botão Fechar -->
    <button class="btn-close-banner" onclick="fecharBannerPremium()" aria-label="Fechar aviso">
        <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Conteúdo Principal -->
    <div class="banner-content">

        <!-- Ícone Sino com Partículas Orbitais -->
        <div class="sino-container">
            <div class="orbita orbita-1"><span class="particula"></span></div>
            <div class="orbita orbita-2"><span class="particula"></span></div>
            <div class="orbita orbita-3"><span class="particula"></span></div>
            <div class="orbita orbita-4"><span class="particula"></span></div>
            <div class="sino-glow"></div>
            <div class="sino-circle">
                <i class="fa-solid fa-bell sino-icon"></i>
                <div class="badge-notif"></div>
            </div>
        </div>

        <!-- Textos -->
        <div class="banner-texto">
            <h4 class="banner-titulo">Aviso de Vencimento</h4>
            <p class="banner-descricao">
                A mensalidade do CONRUJA vence em
                <span class="contador-dias" id="contadorDias">...</span>.
                Evite a suspensão do sistema.
            </p>
        </div>

        <!-- Botão Pagar Premium -->
        <div class="banner-acao">
            <button class="btn-pagar-premium" onclick="abrirFaturaAsaas()">
                <span class="btn-shimmer"></span>
                <i class="fa-solid fa-qrcode"></i>
                <span>Pagar Fatura</span>
            </button>
        </div>

    </div>
</div>
