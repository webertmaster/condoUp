<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Rápido - Condo Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: linear-gradient(135deg, #091020 0%, #111827 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: #0f172a;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-cadastro { text-align: center; margin-bottom: 25px; }
        .header-cadastro img { width: 70px; height: 70px; border-radius: 16px; margin-bottom: 15px; object-fit: cover; }
        .header-cadastro h1 { font-size: 22px; font-weight: 700; color: #f8fafc; }
        .header-cadastro p { font-size: 13px; color: #94a3b8; margin-top: 5px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-group label span.opcional { color: #64748b; font-weight: normal; font-size: 11px; margin-left: 4px; }
        
        .form-group input, .form-group textarea {
            width: 100%; background: #020617; border: 1px solid #1e293b; color: #f8fafc;
            padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-small {
            width: 42px; height: 42px; border-radius: 8px; border: none; color: white; font-size: 16px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex: none;
        }
        .btn-add { background: #10b981; } .btn-add:hover { background: #059669; }
        .btn-remove { background: #ef4444; } .btn-remove:hover { background: #dc2626; }

        .btn-enviar {
            width: 100%; background: linear-gradient(90deg, #2563eb 0%, #0d9488 100%);
            color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); margin-top: 15px;
        }
        .btn-enviar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        .btn-enviar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        #tela-sucesso { display: none; text-align: center; padding: 40px 20px; }
        .icon-success { font-size: 60px; color: #10b981; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- FORMULÁRIO -->
    <div class="form-container" id="box-formulario">
        <div class="header-cadastro">
            <img src="img/icon-512.png.png" alt="Condo Up" onerror="this.style.display='none'">
            <h1>Cadastro de Morador</h1>
            <p>Preencha os dados para criar o seu acesso ao App.</p>
        </div>

        <input type="hidden" id="condominioId">

        <div class="form-group">
            <label>Nome Completo (Responsável)</label>
            <input type="text" id="morador-nome" placeholder="Ex: Carlos Andrade">
        </div>

        <!-- 🚀 AGORA PEDE E-MAIL E SENHA PARA CRIAR A CONTA OFICIAL -->
        <div class="grid-2">
            <div class="form-group">
                <label>E-mail Pessoal</label>
                <input type="email" id="morador-email" placeholder="seuemail@gmail.com">
            </div>
            <div class="form-group">
                <label>Criar Senha</label>
                <input type="password" id="morador-senha" placeholder="Mín. 6 caracteres">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Bloco / Torre <span class="opcional">(Opcional)</span></label>
                <input type="text" id="morador-bloco" placeholder="Ex: B">
            </div>
            <div class="form-group">
                <label>Apartamento</label>
                <input type="number" id="morador-apto" placeholder="Ex: 301">
            </div>
        </div>

        <!-- TELEFONES (Dinâmico) -->
        <div class="form-group">
            <label>WhatsApp / Telefone <span class="opcional">(Opcional)</span></label>
            <div id="container-telefones" style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="tel" class="telefone-input" placeholder="(00) 00000-0000" style="flex: 1; margin: 0;">
                    <button type="button" class="btn-small btn-add" onclick="adicionarTelefone()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <!-- VEÍCULOS (Dinâmico) -->
        <div class="form-group">
            <label>Veículos da Unidade</label>
            <div id="container-veiculos" style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" class="vei-placa" placeholder="Placa" oninput="mascararPlaca(this)" maxlength="8" style="width: 100px; text-transform: uppercase; font-weight: bold; text-align: center; margin: 0;">
                    <input type="text" class="vei-modelo" placeholder="Modelo" style="flex: 1; margin: 0;">
                    <input type="text" class="vei-cor" placeholder="Cor" style="width: 80px; margin: 0;">
                    <button type="button" class="btn-small btn-add" onclick="adicionarVeiculo()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Secretária / Empregada <span class="opcional">(Opcional)</span></label>
            <input type="text" id="morador-secretaria" placeholder="Ex: Joana da Silva">
        </div>

        <div class="form-group">
            <label>Familiares <span class="opcional">(Opcional)</span></label>
            <textarea id="morador-familiares" rows="2" placeholder="Ex: Maria (Esposa), Lucas (Filho)..."></textarea>
        </div>

        <div class="form-group">
            <label>Visitantes / Autorizados <span class="opcional">(Opcional)</span></label>
            <textarea id="morador-visitantes" rows="2" placeholder="Ex: Ana (Sogra), Pedro (Pintor)..."></textarea>
        </div>

        <button class="btn-enviar" onclick="enviarCadastro()"><i class="fa-solid fa-rocket"></i> Criar Conta e Acessar App</button>
    </div>

    <!-- TELA DE SUCESSO -->
    <div class="form-container" id="tela-sucesso">
        <div class="icon-success"><i class="fa-solid fa-circle-check"></i></div>
        <h2 style="color: #f8fafc; margin-bottom: 10px;">Conta Criada com Sucesso!</h2>
        <p style="color: #94a3b8; font-size: 15px; line-height: 1.5;">Você já está logado. Redirecionando para o aplicativo em <strong id="contador" style="color: white;">3</strong> segundos...</p>
    </div>

    <!-- 🚀 SCRIPTS FIREBASE COM O MODULO DE AUTH ADICIONADO -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCY6Jq9GVYJEQrH0JZ9TAWcQVm-cImiwoc",
            authDomain: "portaria-pro-ebc5c.firebaseapp.com",
            projectId: "portaria-pro-ebc5c",
            storageBucket: "portaria-pro-ebc5c.firebasestorage.app",
            messagingSenderId: "948781126590",
            appId: "1:948781126590:web:5e8888eb6e8124f7df5fef"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idCondominioNaUrl = urlParams.get('cond');

            if (idCondominioNaUrl) {
                document.getElementById('condominioId').value = idCondominioNaUrl;
            } else {
                alert("⚠️ Link inválido. Escaneie o QR Code corretamente.");
                document.querySelector('.btn-enviar').disabled = true;
                document.querySelector('.btn-enviar').innerText = 'Link Quebrado';
            }
        });

        function mascararPlaca(input) {
            let valor = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (valor.length > 3) {
                valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
            }
            input.value = valor;
        }

        function adicionarTelefone() {
            const container = document.getElementById('container-telefones');
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.gap = '8px'; div.style.alignItems = 'center';
            div.innerHTML = `
                <input type="tel" class="telefone-input" placeholder="Outro Telefone" style="flex: 1; margin: 0;">
                <button type="button" class="btn-small btn-remove" onclick="this.parentElement.remove()"><i class="fa-solid fa-minus"></i></button>
            `;
            container.appendChild(div);
        }

        function adicionarVeiculo() {
            const container = document.getElementById('container-veiculos');
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.gap = '8px'; div.style.alignItems = 'center';
            div.innerHTML = `
                <input type="text" class="vei-placa" placeholder="Placa" oninput="mascararPlaca(this)" maxlength="8" style="width: 100px; text-transform: uppercase; font-weight: bold; text-align: center; margin: 0;">
                <input type="text" class="vei-modelo" placeholder="Modelo" style="flex: 1; margin: 0;">
                <input type="text" class="vei-cor" placeholder="Cor" style="width: 80px; margin: 0;">
                <button type="button" class="btn-small btn-remove" onclick="this.parentElement.remove()"><i class="fa-solid fa-minus"></i></button>
            `;
            container.appendChild(div);
        }

        async function enviarCadastro() {
            const btn = document.querySelector('.btn-enviar');
            
            const condominioId = document.getElementById('condominioId').value;
            const nome = document.getElementById('morador-nome').value.trim();
            const emailPessoal = document.getElementById('morador-email').value.trim();
            const senha = document.getElementById('morador-senha').value.trim();
            const bloco = document.getElementById('morador-bloco').value.trim() || "Não Informado";
            const apto = document.getElementById('morador-apto').value.trim();
            const secretaria = document.getElementById('morador-secretaria').value.trim();
            const familiares = document.getElementById('morador-familiares').value.trim();
            const visitantes = document.getElementById('morador-visitantes').value.trim();

            if (!nome || !apto || !emailPessoal || !senha) {
                alert("⚠️ Por favor, preencha os campos obrigatórios (Nome, E-mail, Senha e Apartamento).");
                return;
            }

            if (senha.length < 6) {
                alert("⚠️ A senha do aplicativo deve ter pelo menos 6 caracteres.");
                return;
            }

            // Coleta Telefones
            const inputsTel = document.querySelectorAll('.telefone-input');
            const listaTelefones = Array.from(inputsTel).map(input => input.value.trim()).filter(val => val !== "");

            // Coleta Veículos
            const placas = document.querySelectorAll('.vei-placa');
            const modelos = document.querySelectorAll('.vei-modelo');
            const cores = document.querySelectorAll('.vei-cor');
            let veiculosArray = [];
            
            for(let i = 0; i < placas.length; i++) {
                if(placas[i].value || modelos[i].value) {
                    veiculosArray.push({
                        placa: placas[i].value || '',
                        modelo: modelos[i].value || '',
                        cor: cores[i].value || ''
                    });
                }
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            btn.disabled = true;

            try {
                // 🚀 1. SALVA NA TABELA DE CADASTROS PENDENTES PARA O SÍNDICO APROVAR
                await db.collection("cadastrosPendentes").add({
                    nome: nome,
                    email: emailPessoal,
                    senha: senha, // Guarda temporariamente para o robô/síndico criar a conta depois
                    apto: apto,
                    bloco: bloco,
                    secretaria: secretaria,
                    familiares: familiares,
                    visitantes: visitantes,
                    celular: listaTelefones.join(' | ') || "Não Informado",
                    veiculosObj: veiculosArray,
                    condominioId: condominioId,
                    cargo: "Morador",
                    status: "Pendente",
                    dataRegistro: new Date().toISOString()
                });

                // Oculta formulário
                document.getElementById('box-formulario').style.display = 'none';
                
                // 🚀 2. MOSTRA UMA MENSAGEM DE "EM ANÁLISE" EM VEZ DE LOGAR
                const telaSucesso = document.getElementById('tela-sucesso');
                telaSucesso.style.display = 'block';
                telaSucesso.innerHTML = `
                    <div class="icon-success" style="color: #f59e0b;"><i class="fa-solid fa-clock"></i></div>
                    <h2 style="color: #f8fafc; margin-bottom: 10px;">Cadastro em Análise!</h2>
                    <p style="color: #94a3b8; font-size: 15px; line-height: 1.5;">Seus dados foram enviados para a administração. Assim que aprovado, você receberá a liberação para acessar o App.</p>
                `;

            } catch (error) {
                console.error("Erro:", error);
                alert("❌ Erro ao enviar cadastro para aprovação: " + error.message);
                btn.innerHTML = '<i class="fa-solid fa-rocket"></i> Criar Conta e Acessar App';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
