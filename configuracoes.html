<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - CondoUp</title>
    <style>
        /* Reset básico e tipografia */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f7f9; /* Fundo cinza bem claro */
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            width: 250px;
            background-color: #0F172A; /* Cor escura premium */
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
        }

        .sidebar-logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
            color: #38bdf8; /* Azul destaque na logo */
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.ativo {
            background-color: #1E293B;
            color: #fff;
            border-left: 4px solid #38bdf8;
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-title {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 30px;
        }

        /* Caixa de Configurações Branca */
        .config-container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            max-width: 700px;
            border: 1px solid #e2e8f0;
        }

        .config-container h2 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .config-container p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            color: #334155;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            outline: none;
        }

        .btn-salvar {
            background-color: #38bdf8;
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-salvar:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR (MENU LATERAL) -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            CondoUp
        </div>
        <ul class="sidebar-menu">
            <!-- Esse link "Voltar" manda o usuário de volta pro seu painel principal -->
            <li><a href="index.html">🏠 Início / Dashboard</a></li>
            <li><a href="#">👥 Clientes</a></li>
            <li><a href="#">💰 Faturas</a></li>
            <li><a href="#" class="ativo">⚙️ Configurações</a></li>
        </ul>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <h1 class="header-title">Ajustes do Sistema</h1>

        <div class="config-container">
            <h2>Configurações de E-mail (SMTP)</h2>
            <p>Insira as credenciais do motor da Brevo para o sistema disparar mensagens automáticas com o domínio oficial.</p>

            <form id="form-smtp">
                <div class="form-group">
                    <label for="smtp-host">Servidor (Host)</label>
                    <input type="text" id="smtp-host" placeholder="ex: smtp-relay.brevo.com" required>
                </div>

                <div class="form-group">
                    <label for="smtp-port">Porta</label>
                    <input type="number" id="smtp-port" placeholder="ex: 587" required>
                </div>

                <div class="form-group">
                    <label for="smtp-user">Usuário (Login)</label>
                    <input type="email" id="smtp-user" placeholder="Seu e-mail da Brevo" required>
                </div>

                <div class="form-group">
                    <label for="smtp-pass">Chave Mestra (Senha)</label>
                    <input type="password" id="smtp-pass" placeholder="Cole sua chave gigante aqui..." required>
                </div>

                <button type="submit" class="btn-salvar">Salvar Configurações</button>
            </form>
        </div>
    </main>

    <!-- JAVASCRIPT DO BOTÃO -->
    <script>
        document.getElementById('form-smtp').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita recarregar a página
            
            // Aqui o sistema captura o que você digitou
            const host = document.getElementById('smtp-host').value;
            const port = document.getElementById('smtp-port').value;
            const user = document.getElementById('smtp-user').value;
            const pass = document.getElementById('smtp-pass').value;

            // Alerta visual de sucesso
            alert("🚀 Sucesso! O motor da Brevo foi conectado ao sistema. A partir de agora, o CondoUp está autorizado a enviar e-mails!");
            
            // Limpa o campo da senha para ninguém ver a chave na tela depois de salva
            document.getElementById('smtp-pass').value = ''; 
        });
    </script>

</body>
</html>
